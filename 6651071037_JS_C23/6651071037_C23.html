<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tính lương tháng</title>
</head>
<body>
	<h2>Tính lương tháng</h2>
	<form id="formTinhLuong">
		<table>
			<tr>
				<td><label for="luong">Lương:</label></td>
				<td><input type="number" id="luong" min="0" step="any" required></td>
			</tr>
			<tr>
				<td><label for="heSoLuong">Hệ số lương:</label></td>
				<td><input type="number" id="heSoLuong" min="0" step="any" required></td>
			</tr>
			<tr>
				<td><label for="luongThang">Lương tháng:</label></td>
				<td><input type="text" id="luongThang" readonly></td>
			</tr>
			<tr>
				<td colspan="2"><button type="submit">Tính lương tháng</button></td>
			</tr>
		</table>
	</form>
	<p id="thongBao" aria-live="polite"></p>

	<script src="6651071037_JS_C23.js"></script>
</body>
</html>
