<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Danh sách đơn hàng</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #202c25;
			--muted: #69766d;
			--line: #dfe6dc;
			--paper: #f3f6f0;
			--white: #fff;
			--leaf: #275b45;
			--leaf-soft: #e8f1e9;
			--red: #b63d35;
			--red-soft: #fff0ed;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: "DM Sans", sans-serif;
			font-size: 14px;
		}
		header {
			min-height: 72px;
			padding: 0 max(22px, calc((100% - 1080px) / 2));
			display: flex;
			align-items: center;
			background: var(--white);
			border-bottom: 1px solid var(--line);
		}
		.brand {
			margin: 0;
			color: var(--leaf);
			font-size: 13px;
			font-weight: 700;
			letter-spacing: 1.4px;
		}
		main { width: min(1080px, calc(100% - 40px)); margin: 38px auto 64px; }
		.page-heading {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 22px;
		}
		h1 {
			margin: 0;
			font-family: "DM Serif Display", Georgia, serif;
			font-size: 34px;
			font-weight: 400;
		}
		.subtitle { margin: 6px 0 0; color: var(--muted); }
		.row-count {
			flex: 0 0 auto;
			padding: 8px 12px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--white);
			color: var(--leaf);
			font-size: 12px;
			font-weight: 700;
		}
		.table-frame {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--white);
		}
		.table-scroll { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th {
			padding: 13px 18px;
			background: #f7f9f6;
			color: var(--muted);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.8px;
			text-transform: uppercase;
			white-space: nowrap;
		}
		td { padding: 15px 18px; border-top: 1px solid var(--line); }
		tbody tr { transition: background-color 120ms ease; }
		tbody tr:hover { background: #fbfcfa; }
		td:first-child, th:first-child { width: 64px; color: var(--muted); }
		.numeric { text-align: right; font-variant-numeric: tabular-nums; }
		th:last-child, td:last-child { width: 120px; text-align: center; }
		.delete-button {
			min-height: 34px;
			padding: 0 12px;
			border: 1px solid #f0cbc6;
			border-radius: 5px;
			background: var(--red-soft);
			color: var(--red);
			font: inherit;
			font-size: 12px;
			font-weight: 700;
			cursor: pointer;
		}
		.delete-button:hover { border-color: var(--red); background: #ffe4df; }
		.delete-button:focus-visible { outline: 3px solid #f1c1b9; outline-offset: 2px; }
		.empty-row td { padding: 40px 18px; color: var(--muted); text-align: center; }
		#thongBao { min-height: 20px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; }
		@media (max-width: 620px) {
			main { width: calc(100% - 28px); margin-top: 28px; }
			.page-heading { align-items: start; flex-direction: column; gap: 12px; }
			h1 { font-size: 30px; }
			table { min-width: 500px; }
			th, td { padding-right: 13px; padding-left: 13px; }
		}
	</style>
</head>
<body>
	<header><p class="brand">ĐƠN HÀNG</p></header>
	<main>
		<div class="page-heading">
			<div>
				<h1>Chi tiết đơn hàng</h1>
				<p class="subtitle">Số lượng, đơn giá và tổng tiền từng dòng</p>
			</div>
			<span class="row-count" id="soLuong">4 dòng</span>
		</div>
		<div class="table-frame">
			<div class="table-scroll">
				<table>
					<thead>
						<tr><th scope="col" class="numeric">Số lượng</th><th scope="col" class="numeric">Đơn giá</th><th scope="col" class="numeric">Tổng</th><th scope="col">Chức năng</th></tr>
					</thead>
					<tbody id="danhSach">
						<tr data-row data-quantity="2" data-price="15000"><td class="numeric">2</td><td class="numeric">15.000đ</td><td class="line-total numeric"></td><td><button class="delete-button" type="button" data-action="delete">Xóa</button></td></tr>
						<tr data-row data-quantity="1" data-price="25000"><td class="numeric">1</td><td class="numeric">25.000đ</td><td class="line-total numeric"></td><td><button class="delete-button" type="button" data-action="delete">Xóa</button></td></tr>
						<tr data-row data-quantity="4" data-price="8000"><td class="numeric">4</td><td class="numeric">8.000đ</td><td class="line-total numeric"></td><td><button class="delete-button" type="button" data-action="delete">Xóa</button></td></tr>
						<tr data-row data-quantity="3" data-price="12000"><td class="numeric">3</td><td class="numeric">12.000đ</td><td class="line-total numeric"></td><td><button class="delete-button" type="button" data-action="delete">Xóa</button></td></tr>
					</tbody>
				</table>
			</div>
		</div>
		<p id="thongBao" aria-live="polite"></p>
	</main>
	<script src="661071037_JS_C27.js"></script>
</body>
</html>
