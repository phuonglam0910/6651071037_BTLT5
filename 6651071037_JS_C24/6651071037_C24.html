<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tìm thứ trong tuần</title>
	<style>
		body {
			text-align: center;
		}

		.date-fields {
			display: flex;
			justify-content: center;
			gap: 16px;
			flex-wrap: wrap;
			margin: 20px 0;
		}

		.date-field label {
			display: block;
			margin-bottom: 6px;
		}

		.date-field input {
			box-sizing: border-box;
			width: 130px;
		}

		#formNgay button {
			display: block;
			margin: 0 auto;
		}
	</style>
</head>
<body>
	<h2>Tìm thứ trong tuần</h2>
	<form id="formNgay">
		<div class="date-fields">
		<div class="date-field">
			<label for="ngay">Ngày:</label>
			<input type="number" id="ngay" min="1" max="31" step="1" required>
		</div>
		<div class="date-field">
			<label for="thang">Tháng:</label>
			<input type="number" id="thang" min="1" max="12" step="1" required>
		</div>
		<div class="date-field">
			<label for="nam">Năm:</label>
			<input type="number" id="nam" min="1" max="9999" step="1" required>
		</div>
		</div>
		<button type="submit">Xem thứ</button>
	</form>
	<p id="ketqua" aria-live="polite"></p>

	<script src="6651071037_JS_C24.js"></script>
</body>
</html>
